<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="600" y="76" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="700" fill="#172033">先只看一个特征：户外程度</text>
  <text x="600" y="118" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#667085">每项活动暂时只用一个数字表示</text>
  <line x1="130" y1="350" x2="1070" y2="350" stroke="#344054" stroke-width="5" stroke-linecap="round"/>
  <polygon points="1070,350 1048,338 1048,362" fill="#344054"/>
  <text x="130" y="405" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#667085">室内</text>
  <text x="1070" y="405" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#667085">户外</text>

  <g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">
    <circle cx="225" cy="350" r="17" fill="#7f56d9"/>
    <line x1="225" y1="333" x2="225" y2="255" stroke="#7f56d9" stroke-width="3"/>
    <rect x="150" y="194" width="150" height="58" rx="18" fill="#ede9fe"/>
    <text x="225" y="231" text-anchor="middle" font-size="24" font-weight="600" fill="#5b21b6">电影院</text>

    <circle cx="285" cy="350" r="17" fill="#7f56d9"/>
    <line x1="285" y1="367" x2="285" y2="455" stroke="#7f56d9" stroke-width="3"/>
    <rect x="210" y="458" width="150" height="58" rx="18" fill="#ede9fe"/>
    <text x="285" y="495" text-anchor="middle" font-size="24" font-weight="600" fill="#5b21b6">密室逃脱</text>

    <circle cx="855" cy="350" r="17" fill="#039855"/>
    <line x1="855" y1="333" x2="855" y2="255" stroke="#039855" stroke-width="3"/>
    <rect x="780" y="194" width="150" height="58" rx="18" fill="#dcfae6"/>
    <text x="855" y="231" text-anchor="middle" font-size="24" font-weight="600" fill="#027a48">游乐园</text>

    <circle cx="950" cy="350" r="17" fill="#039855"/>
    <line x1="950" y1="367" x2="950" y2="455" stroke="#039855" stroke-width="3"/>
    <rect x="875" y="458" width="150" height="58" rx="18" fill="#dcfae6"/>
    <text x="950" y="495" text-anchor="middle" font-size="24" font-weight="600" fill="#027a48">公园散步</text>
  </g>
  <rect x="238" y="555" width="724" height="56" rx="16" fill="#fff4e5" stroke="#fdb022" stroke-width="2"/>
  <text x="600" y="590" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#934b00">只看“户外”，公园和游乐园几乎一样；电影院和密室也几乎一样</text>
</svg>
